# The turn, in the format the program executes.
# Each step: the program decides WHETHER it runs (`when`), builds the AI's INPUT, loads only the
# listed RULES, validates the AI's OUTPUT against `output`, and then EXECUTES it (`program`).
# The AI never rolls, adds, keeps time or writes a save; it only fills `output`.
# Rule files live in engine/rules/ (own numbering, see docs/MAP_FROM_V5.md).

# Run once when a game starts (flow.intake), not every turn.
intake:
  id: intake
  rules: [16_intake]
  input: [today, plan_notes]
  output:
    type: object
    required: [actors]
    properties:
      actors:
        type: array
        items:
          type: object
          required: [id, dues, triggers]
          properties:
            id: {type: string}
            dues:
              type: array
              items:
                type: object
                required: [day_offset, at, what]
                properties:
                  day_offset: {type: integer, minimum: 0, maximum: 400}
                  at: {type: string}
                  what: {type: string}
            triggers: {type: array, items: {type: string}}
  program: set_dues

turn:
  - id: sort
    when: always
    rules: [01_jobs, 03_invariants, 05_player_side, 06_sorting]
    input: [player_text, place, active_quests]
    output:
      type: object
      required: [kind, steps]
      properties:
        kind:  {type: string, enum: [fast, loop, retrieval, continuation]}
        steps: {type: array, items: {type: string, enum: [judge, fight, react, quest]},
                description: "only the parts whose trigger fired; empty for fast and retrieval"}
        note:  {type: string, description: "fast: what simply happens; retrieval: the answer from the records"}
    program: route          # kind fast/retrieval -> straight to tell; else run the listed steps

  - id: judge
    when: "'judge' in sort.steps"
    rules: [04_truth, 07_possible, 08_roll_setup, 09_stakes]
    input: [player_text, place, player_state, records_in_play]
    output:
      type: object
      required: [verdict]
      properties:
        verdict:  {type: string, enum: [certain, impossible, roll]}
        reason:   {type: string}
        roll:
          type: object
          required: [capability, base, stakes]
          properties:
            capability: {type: integer, enum: [-4, -2, 0, 2, 4]}
            base:       {type: integer, minimum: 1, maximum: 20}
            conditions: {type: object, description: "environment|time|sensory|position|simultaneous: -1,0,1,2"}
            tool:       {type: object, properties: {fit: {type: integer}, condition: {type: integer}}}
            stakes:
              type: object
              required: [success, failure]
              properties:
                success: {type: string}
                failure: {type: string}
                harm:    {type: string, enum: [none, setback, loss, severe]}
        decision: {type: object, description: "set only when the decision gate fires", properties: {question: {type: string}, options: {type: array}}}
    program: roll           # validate -> odds -> (odds stop?) -> check() -> result record; XP/evidence if success

  - id: fight
    when: "'fight' in sort.steps"
    rules: [10_fights]
    input: [player_text, player_state, records_in_play, plan, morale_norms]
    output:
      type: object
      required: [exchanges]
      properties:
        foes:
          type: array
          description: "opponents not yet in the records; the program adds them"
          items:
            type: object
            required: [id, name, v, size]
            properties:
              id:   {type: string}
              name: {type: string}
              v:    {type: integer, minimum: 1, description: "its level for HP"}
              size: {type: string, enum: [small, normal, large, huge]}
        exchanges:
          type: array
          maxItems: 6
          description: "the exchanges the player's orders and style cover, in order"
          items:
            type: object
            required: [foe, roll, on_success, my_source, on_failure, attackers]
            properties:
              foe:        {type: string, description: "id of the engaged opponent"}
              roll:       {type: object, required: [capability, base], properties: {capability: {type: integer, enum: [-4, -2, 0, 2, 4]}, base: {type: integer, minimum: 1, maximum: 20}, conditions: {type: object}, tool: {type: object}}}
              on_success: {type: string, enum: [partial, full, decisive]}
              my_source:  {type: string, description: "damage source of the player's blow: unarmed|light|one-handed|two-handed|bow|small|man-sized|large|huge"}
              on_failure: {type: string, enum: [setback, loss, severe]}
              attackers:  {type: array, description: "who can hit the player on a failure", items: {type: object, required: [who, source], properties: {who: {type: string}, source: {type: string}}}}
              soak:       {type: integer, minimum: 0, maximum: 2}
        stop: {type: string, description: "why the orders no longer cover the next exchange, if so"}
    program: combat         # rolls each exchange, damage, soak, HP, down/dead, lasting injury

  - id: react
    when: "'react' in sort.steps"
    rules: [11_actors, 12_world]
    input: [place, time, actors_present, dues_fired, pressures, player_text, results_so_far]
    output:
      type: object
      required: [minutes, ops]
      properties:
        minutes: {type: integer, minimum: 0, description: "believable duration of what happened"}
        asks:
          type: array
          items:
            type: object
            required: [question, likelihood]
            properties:
              question:   {type: string}
              likelihood: {type: integer, minimum: -3, maximum: 3}
              for:        {type: string}
              against:    {type: string}
        ops:
          type: array
          items:
            type: object
            required: [op, path]
            properties:
              op:    {type: string, enum: [set, append, remove, plan]}
              path:  {type: string}
              value: {}
              due_in_minutes: {type: integer, minimum: 0}
    program: apply          # rolls asks, advances the clock, fires dues, applies ops through the write rules

  - id: quest
    when: "'quest' in sort.steps"
    rules: [13_quests, 14_endings]
    input: [player_text, active_quests, results_so_far]
    output:
      type: object
      required: [ops]
      properties:
        ops: {type: array}
    program: apply

  - id: tell
    when: always
    rules: [15_telling_it]
    input: [place, facts_from_program, player_text]
    max_tokens: 500
    output: {type: string}
    program: show           # header, roll lines, cash line are printed by the program around this text

  - id: audit
    when: always
    rules: [03_invariants, 15_telling_it]
    input: [place, prose, facts_from_program]
    output:
      type: object
      required: [ok]
      properties:
        ok:       {type: boolean}
        problems: {type: array, items: {type: string}}
    program: audit          # not ok -> tell once more with the problems listed; then show
