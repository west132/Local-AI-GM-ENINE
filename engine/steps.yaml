# THE TURN, in the form the program runs. This file is the only definition of the workflow:
# the runner (localgm/flow.py) walks `turn` in order and does nothing this file does not say.
#   when     evaluated by the program (names: sort, turn); `always` or a Python expression
#   ai       false = the program does this step alone
#   rules    judgement rule files loaded for this step (engine/rules/)
#   input    what the program shows the AI (see flow.inputs)
#   output   the form the AI must fill in; anything else is refused
#   program  the named handler that validates and commits the reply (flow.HANDLERS)
# The AI never rolls, adds, keeps time or writes a save. It decides, and the program rolls and records.
# Order matters: a roll or ask is resolved by the program BEFORE the AI is asked what follows from it.

defs:
  askitem: &askitem
      type: object
      required: [question, obvious, likelihood]
      properties:
        question:   {type: string, description: "yes/no, ending in ?"}
        obvious:    {type: string, description: "the obvious answer if one exists, as 'YES - why' or 'NO - why' (nothing is rolled); otherwise exactly 'none'"}
        likelihood: {type: integer, minimum: -3, maximum: 3}
        for:        {type: string}
        against:    {type: string}
        cites:      {type: array, items: {type: string}, description: "record paths behind the question; they must exist"}
        governs:    {type: array, items: {type: string}, description: "record paths the answer decides"}
        changed:    {type: string, description: "if this question was answered before: what is materially new"}

# Run once when a game starts (flow.intake), not every turn.
intake:
  id: intake
  rules: [16_intake]
  task: |
    Convert each plan note into dues (a moment on the clock: day_offset from TODAY, a time, what happens) and triggers (conditions with no clock). Copy what the note says; invent nothing.
    Reply with the JSON object only.
  input: [today, plan_notes]
  output:
    type: object
    required: [actors]
    properties:
      actors:
        type: array
        items:
          type: object
          required: [id, dues, triggers]
          properties:
            id: {type: string}
            dues:
              type: array
              items:
                type: object
                required: [day_offset, at, what]
                properties:
                  day_offset: {type: integer, minimum: 0, maximum: 400}
                  at: {type: string}
                  what: {type: string}
            triggers: {type: array, items: {type: string}}
            interval_minutes: {type: integer, minimum: 1, description: "pressures only: how often the clock is checked"}
  program: set_dues

turn:
  - id: sort
    when: always
    rules: [05_player_side, 06_sorting, 19_play_lessons]
    task: |
      Sort the player's action (the PLAYER line) and fill the form. Choose one kind:
      - fast: the player's own ordinary action, safe and certain, nobody else involved. steps = []. note = what simply happens, one or two sentences.
      - retrieval: the player only asks what they have, know or see. steps = []. note = the answer, taken from the records.
      - continuation: wait, carry on, travel, a routine. steps = []. note = what carries on and for how long.
      - loop: anything else: another person is spoken to or affected, the outcome is uncertain or risky, something lasting changes, or the player goes somewhere.
        steps = the parts needed, from: judge (is it possible, certain or uncertain), fight (violence), react (the world and the people answer), quest (a job, lead or promise).
        Always include react when a person is spoken to or affected.
      - confirm: ONLY if "WAITING FOR THE PLAYER'S GO-AHEAD" is shown above and the player agrees to exactly that.
      Examples (other game):
        PLAYER "I put the lamp on the shelf"            -> {"kind":"fast","steps":[],"note":"The lamp sits on the shelf."}
        PLAYER "What coins do I have?"                  -> {"kind":"retrieval","steps":[],"note":"Four silver and a copper, from your purse."}
        PLAYER "I ask the smith if he can mend my sword" -> {"kind":"loop","steps":["react"],"note":"The smith is asked."}
        PLAYER "I try to climb the wall and I draw my knife if a guard comes" -> {"kind":"loop","steps":["judge","react"],"note":"A climb that could fail."}
      Reply with the JSON object only.
    input: [player_who, player_text, place, active_quests, pending]
    output:
      type: object
      required: [kind, steps]
      properties:
        kind:  {type: string, enum: [fast, loop, retrieval, continuation, confirm]}
        steps: {type: array, items: {type: string, enum: [judge, fight, react, quest]},
                description: "only the parts whose trigger fired; empty for fast, retrieval and confirm"}
        note:  {type: string, description: "REQUIRED for fast, retrieval and continuation (the program carries it to the telling): fast = what simply happens; retrieval = the answer, from the records; continuation = what carries on and for how long"}
    program: route

  - id: confirmed
    when: "sort.kind == 'confirm' and turn.pending"
    ai: false
    program: roll_pending

  - id: judge
    when: "'judge' in sort.steps"
    rules: [01_jobs, 02_directive, 04_truth, 07_possible, 08_roll_setup, 09_stakes]
    task: |
      Decide whether the player's action works, using the records above. Cite the exact record paths you rely on (see RECORDS YOU CAN CITE).
      - certain: the records settle that it works (an ordinary step of their trade, an unlocked door). verdict certain, cites, reason in one sentence.
      - impossible: the records rule it out (no such item, no way there, a hard limit). verdict impossible, cites, reason.
      - roll: it could honestly go either way and it depends on the PLAYER'S OWN skill or luck (a lock, a climb, a chase). Fill `roll`: subject, capability, base,
        skill, and stakes: what success and failure each mean, and harm (none, setback, loss, severe).
      - ask: it depends on what a PERSON decides or knows (will she show it? does he agree?). verdict ask, and `asks`: yes/no questions ending in "?".
        For each: obvious = "YES - why" or "NO - why" when the records already settle it (nothing is rolled), else "none".
      - If the action has a real cost, danger or irreversible step that the player's own orders do not answer, fill `decision` (the question and 2-5 options with their costs).
      Never roll something another person decides. Never decide the result of a roll yourself.
      Reply with the JSON object only.
    input: [player_text, place, player_state, records_in_play, results_so_far, resolved_facts]
    output:
      type: object
      required: [verdict, cites]
      properties:
        verdict:  {type: string, enum: [certain, impossible, roll, ask]}
        reason:   {type: string}
        asks:
          type: array
          description: "with verdict 'ask' only: questions whose answers you need BEFORE you can set this up (e.g. whether someone lets you handle the thing). The program answers, then asks you again."
          items: *askitem
        cites:    {type: array, items: {type: string}, description: "record paths this verdict rests on; they must exist"}
        uncertain: {type: string, description: "for a roll: what exactly remains open"}
        roll:
          type: object
          required: [subject, capability, base, stakes]
          properties:
            subject:    {type: string, description: "the thing being attempted, in a few words, e.g. pick_lock:cellar_door"}
            changed:    {type: string, description: "if this subject was rolled before: what is materially different now"}
            governs:    {type: array, items: {type: string}, description: "record paths this result decides"}
            capability: {type: integer, enum: [-4, -2, 0, 2, 4]}
            base:       {type: integer, minimum: 1, maximum: 20}
            conditions: {type: object, description: "environment|time|sensory|position|simultaneous: -1,0,1,2"}
            tool:       {type: object, properties: {fit: {type: integer}, condition: {type: integer}}}
            skill:      {type: string, description: "id of the player's skill used, if any"}
            equipment:  {type: string, description: "item_id of the gear that directly supports this action, if any"}
            cast:       {type: string, description: "id of the MP-drawing power used, if any (its cost is paid whether or not it works)"}
            challenge:  {type: integer, minimum: 1, description: "numeric Challenge of the task, if it has one"}
            scope:      {type: string, enum: [routine, minor, meaningful, major, exceptional], description: "how much the task matters, for experience"}
            committed:  {type: boolean, description: "true if a standing order, plan or fighting style already commits the player to this risk"}
            stakes:
              type: object
              required: [success, failure]
              properties:
                success: {type: string}
                failure: {type: string}
                harm:    {type: string, enum: [none, setback, loss, severe]}
                source:  {type: string, description: "when harm is loss or severe: what hurts (unarmed|light|one-handed|two-handed|bow|small|man-sized|large|huge|hazard-light|hazard-serious|hazard-grave|T1|T2|T3|T4)"}
                soak:    {type: integer, minimum: 0, maximum: 2}
        decision: {type: object, required: [question, options], description: "set only when the decision gate fires (the player's own orders do not answer it): the program stops here and shows it; nothing is rolled", properties: {question: {type: string, minLength: 5}, options: {type: array, minItems: 2, maxItems: 5, items: {type: string}, description: "each option with its cost or risk"}}}
    program: roll

  - id: fight
    when: "'fight' in sort.steps"
    rules: [10_fights, 19_play_lessons]
    task: |
      The player is fighting. Fill the form.
      - foes: opponents that are NOT yet in the records (a creature or enemy in the scene): each with a NEW id, name, v (level) and size. Never put a person from the records here.
      - exchanges: one entry per exchange the player's order covers (an order to kill covers exchanges until the foe is down; set kill true). Each: foe (a foe id), roll (capability, base, skill, equipment, conditions),
        on_success, on_failure, my_source, attackers who can hit back.
      - Never target someone the player did not attack.
      Reply with the JSON object only.
    input: [place, actors_present, player_text, player_state, records_in_play]
    output:
      type: object
      required: [exchanges]
      properties:
        foes:
          type: array
          description: "opponents not yet in the records; the program adds them"
          items:
            type: object
            required: [id, name, v, size]
            properties:
              id:   {type: string}
              name: {type: string}
              v:    {type: integer, minimum: 1, description: "its level for HP"}
              size: {type: string, enum: [small, normal, large, huge]}
        exchanges:
          type: array
          maxItems: 6
          description: "the exchanges the player's orders and style cover, in order"
          items:
            type: object
            required: [foe, roll, on_success, my_source, on_failure, attackers]
            properties:
              foe:        {type: string, description: "id of the engaged opponent"}
              roll:       {type: object, required: [capability, base], properties: {capability: {type: integer, enum: [-4, -2, 0, 2, 4]}, base: {type: integer, minimum: 1, maximum: 20}, conditions: {type: object}, tool: {type: object}, skill: {type: string}, equipment: {type: string}, challenge: {type: integer, minimum: 1}}}
              on_success: {type: string, enum: [partial, full, decisive]}
              my_source:  {type: string, description: "damage source of the player's blow"}
              on_failure: {type: string, enum: [setback, loss, severe]}
              attackers:  {type: array, description: "who can hit the player on a failure", items: {type: object, required: [who, source], properties: {who: {type: string}, source: {type: string}}}}
              soak:       {type: integer, minimum: 0, maximum: 2}
        kill: {type: boolean, description: "true if the player's order is to kill: a foe that goes down is then finished at once, without a roll"}
        stop: {type: string, description: "why the orders no longer cover the next exchange, if so"}
    program: combat

  # A: the AI says what is uncertain. Nothing is committed. B: the program rolls it.
  - id: wonder
    when: "'react' in sort.steps"
    rules: [01_jobs, 02_directive, 11_actors, 19_play_lessons]
    task: |
      List the yes/no questions about what PEOPLE decide, know or do that the records do NOT settle and that matter for this action.
      Each question: ends in "?"; obvious = "YES - why" or "NO - why" if the records settle it (then nothing is rolled), otherwise "none";
      likelihood -3..+3 from the records (never from what the player needs); cites = exact record paths. No question about the player's own actions.
      If nothing is open, reply {"asks": []}. Example: {"asks":[{"question":"Does the smith agree to mend the sword today?","obvious":"none","likelihood":1,"cites":["npcs.smith.drives"]}]}
      Reply with the JSON object only.
    input: [place, actors_present, player_brief, records_in_play, dues_fired, player_text, results_so_far, resolved_facts]
    output:
      type: object
      required: [asks]
      properties:
        asks:
          type: array
          items: *askitem
    program: ask_roll

  # C: the AI is told the results and says what follows from them. D: the program validates and commits, all or nothing.
  - id: react
    when: "'react' in sort.steps"
    rules: [01_jobs, 02_directive, 11_actors, 12_world, 19_play_lessons]
    task: |
      Say what happens in the world because of the player's action and the RESULTS above. Every person acts from their own record, not from what the player wants.
      1. If you still need an answer first, fill `asks` (yes/no questions ending in "?", each with obvious/likelihood/cites) and leave the rest empty.
      2. Otherwise fill: `report` (plain sentences: who did what and why, only what the player can see, hear or learn), `minutes`, and `ops`:
         each change with its exact path (see RECORDS YOU CAN CITE), `because`, `channel` if a person learns something, and `requires` {on, answer} on any path a RESULT governs.
         Add money, rest, heal, moved_to and the other typed fields only if that happened. Do not repeat a change that is already recorded.
      Never overrule a RESULT. Failure stays failure.
      Reply with the JSON object only.
    input: [place, actors_present, player_brief, records_in_play, dues_fired, pressures, player_text, results_so_far, resolved_facts]
    output:
      type: object
      required: [minutes, ops]
      properties:
        asks:
          type: array
          description: "ONLY if you need another result before you can decide: ask here and leave minutes/ops empty; the program answers and asks you again. Empty when you are ready to decide."
          items: *askitem
        report: {type: string, description: "REQUIRED when you are not asking: what happened in the world during this action, in plain sentences: who did what and why, only what the player could see, hear or learn. The telling is built from this, so it must cover every change you record that the player would notice"}
        minutes: {type: integer, minimum: 0, description: "believable duration of what happened"}
        moved_to: {type: string, description: "the place id where the player stands when this action ends, if it changed; the place must be in the records (a new place is written in ops first)"}
        ops:
          type: array
          description: "record changes consistent with every RESULT shown to you"
          items:
            type: object
            required: [op, path]
            properties:
              op:    {type: string, enum: [set, append, remove, plan, tracker]}
              path:  {type: string}
              value: {}
              due_in_minutes: {type: integer, minimum: 0}
              requires: {type: object, description: "REQUIRED for any path a result governs: {on: the question or subject, answer: YES|NO|SUCCESS|FAILURE}", properties: {"on": {type: string}, answer: {type: string, enum: ["YES", "NO", "SUCCESS", "FAILURE"]}, band: {type: string, enum: ["AND", "BUT"], description: "optional: the result was 'YES, AND' / 'NO, BUT' etc.; it must match"}}}
              because:  {type: string, description: "the cause, in a few words"}
              channel:  {type: string, description: "REQUIRED when the change is something a person or faction learns: how they learned it (witnessed, report, told by ...)"}
        money:  {type: integer, description: "the player's cash change: negative = spent, positive = received"}
        rest:   {type: string, enum: [none, rest, sleep], description: "rest = the time was spent resting; sleep = a full night's sleep"}
        boundary: {type: string, enum: [none, training, aftermath], description: "a growth boundary: dedicated training or downtime, or the settled aftermath of a resolved arc (sleep counts by itself)"}
        class_sources: {type: object, description: "skill_id -> the class source materially involved while evidence accrued (teacher, institution, method, tested innovation)"}
        companion_join:
          type: array
          description: "people who now travel with the player (needs causal support in the records); the program tracks their level and XP"
          items:
            type: object
            required: [id, level]
            properties:
              id:    {type: string}
              level: {type: integer, minimum: 1, maximum: 35}
        companion_leave: {type: array, items: {type: string}, description: "ids of tracked companions who stop travelling with the player"}
        heal:
          type: array
          description: "healing the player or someone gave this turn"
          items:
            type: object
            required: [who, source]
            properties:
              who:    {type: string, description: "player or an npc id"}
              source: {type: string, description: "stabilise | minor | standard | strong | T1 | T2 | T3 | T4 | hour (an hour of rest) | night (a full night)"}
        treat:
          type: array
          description: "real treatment of a lasting injury started or stopped (healer, restoration power, strong healing item, tended rest)"
          items:
            type: object
            required: [injury, action]
            properties:
              injury: {type: string}
              action: {type: string, enum: [start, stop]}
              deep:   {type: boolean, description: "bone or deep injury: 7 days instead of 3"}
        draw:
          type: array
          description: "a meaningful use of a supply the player holds"
          items:
            type: object
            required: [resource]
            properties:
              resource: {type: string}
              amount:   {type: integer, minimum: 1}
        resupply:
          type: array
          description: "real resupply through an established process"
          items:
            type: object
            required: [resource]
            properties:
              resource: {type: string}
              die:      {type: string, enum: [d12, d10, d8, d6]}
              count:    {type: integer, minimum: 1}
        entitlement: {type: object, required: [item, tier, reason], description: "spend item points to make one unestablished detail true about the player's own gear", properties: {item: {type: string}, tier: {type: string, enum: [trivial, ordinary, T1, T2, T3, T4]}, reason: {type: string, description: "the in-world reason, consistent with every established fact"}}}
        item_points_gain: {type: object, required: [amount, source], description: "only from an open-ended entitlement source after a major resolved achievement", properties: {amount: {type: integer, minimum: 1, maximum: 4}, source: {type: string}}}
        clocks:
          type: array
          description: "one entry for each CLOCK shown as due"
          items:
            type: object
            required: [pressure, operated]
            properties:
              pressure: {type: string}
              operated: {type: boolean, description: "the process actually operated since the last check"}
              extra:    {type: boolean, description: "a plainly accelerating event, one extra segment"}
    program: commit

  - id: offer
    when: "'quest' in sort.steps"
    rules: [18_offer]
    task: |
      Did this action make a genuinely new job, lead or promise available to the player? new_offer true or false. Most actions: false.
      Reply with the JSON object only.
    input: [player_text, active_quests, results_so_far]
    output:
      type: object
      required: [new_offer]
      properties:
        new_offer: {type: boolean}
    program: shape_roll

  - id: quest
    when: "'quest' in sort.steps"
    rules: [13_quests, 14_endings]
    task: |
      Record the quest changes this action and its RESULTS show (accepted, progressed, completed, failed, abandoned) as ops on the quests, with exact paths. Nothing the RESULTS do not support.
      If nothing changed, reply {"ops": []}.
      Reply with the JSON object only.
    input: [player_text, active_quests, results_so_far]
    output:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          items:
            type: object
            required: [op, path]
            properties:
              op:    {type: string, enum: [set, append, remove, tracker]}
              path:  {type: string}
              value: {}
    program: commit_ops

  - id: injury
    when: "turn.injury_owed"
    rules: [17_injury]
    task: |
      The player took a lasting injury. Name it (injury), choose where it acts (home) and state exactly what changes (effect, at least a clause). Do not invent a second injury.
      Reply with the JSON object only.
    input: [player_state, results_so_far]
    output:
      type: object
      required: [injury, home, effect]
      properties:
        injury: {type: string}
        home:   {type: string, enum: [capability, feasibility, environment, time, sensory, position, simultaneous]}
        effect: {type: string}
    program: record_injury

  - id: ending
    when: "turn.module('bounded_scenario_endings') and sort.steps"
    rules: [14_endings]
    task: |
      List in `met` the ids of ending conditions a resolved event has now met, and in `closed` the ids now permanently out of reach. If none, both empty.
      Reply with the JSON object only.
    input: [ending_conditions, results_so_far]
    output:
      type: object
      required: [met, closed]
      properties:
        met:    {type: array, items: {type: string}, description: "ids of conditions a resolved event has now met"}
        closed: {type: array, items: {type: string}, description: "ids now permanently unreachable"}
    program: ending

  - id: checkpoint
    optional: true          # the turn stands if this one fails twice; every other step must succeed or the turn is dropped
    when: "turn.checkpoint_due"
    rules: [20_checkpoint]
    task: |
      Close only what the records show is settled (a quest whose objective was met, a right whose terms are done). Each closing is an op with the path and `because`. Leave live things open and say why in notes.
      Reply with the JSON object only.
    input: [open_items, resolved_facts]
    output:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          description: "close what the records show is settled; nothing new"
          items:
            type: object
            required: [op, path]
            properties:
              op:      {type: string, enum: [set, append, remove]}
              path:    {type: string}
              value:   {}
              because: {type: string, description: "the record that shows it is settled"}
              requires: {type: object, properties: {"on": {type: string}, answer: {type: string, enum: ["YES", "NO", "SUCCESS", "FAILURE"]}}}
        notes: {type: array, items: {type: string}, description: "open items you left open, and why"}
    program: commit_ops

  - id: tell
    when: "not turn.halt"
    rules: [15_telling_it]
    task: |
      Write what the player sees and hears now: a short scene of about 80-200 words, present tense, second person ("you"). Tell what happens from THE GM'S DECISION / WHAT HAPPENED and the RESULTS above;
      people speak in their own voices (quoted dialogue); add the place's atmosphere. Stop where the player must decide. Do not repeat the player's words, do not add an event, a fact or a reward that is not above,
      do not use labels, lists or headings. Reply with the scene text only.
    input: [player_who, place, facts_from_program, player_text]
    max_tokens: 500
    output: {type: string}
    program: show

  - id: audit
    optional: true          # the turn stands if this one fails twice; every other step must succeed or the turn is dropped
    when: "not turn.halt"
    rules: [03_invariants, 15_telling_it]
    task: |
      Check TEXT TO CHECK against the FACTS and RESULTS. ok = false only if the text adds an event, fact or reward that is not in them, contradicts them, speaks or decides for the player, or reveals what the player has not learned.
      problems = each fault in a few words. Otherwise ok = true.
      Reply with the JSON object only.
    input: [player_who, place, prose, facts_from_program]
    output:
      type: object
      required: [ok]
      properties:
        ok:       {type: boolean}
        problems: {type: array, items: {type: string}}
    program: audit

  - id: epilogue
    optional: true          # the turn stands if this one fails twice; every other step must succeed or the turn is dropped
    when: "turn.ended_now"
    rules: [21_epilogue]
    task: |
      The story has ended. Write a closing recap of about 150-300 words: how it ended and what the main people and places become, from the records and story so far. Add no new facts. Reply with the text only.
    input: [place, facts_from_program, story_so_far]
    max_tokens: 700
    output: {type: string}
    program: epilogue
