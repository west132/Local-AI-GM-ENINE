# Making a new world from a short idea. Six forms, one after another; the program checks each, sends the faults back
# for a fix, and assembles the BACKGROUND itself. The AI never writes the file, only fills the forms.
stages:
  - id: premise
    rules: [22_gen_premise]
    max_tokens: 2200
    output:
      type: object
      required: [title, background_id, source_game, world, era, starting_region, mode, allowed_deviations, anchors, norms, mp_powers, depicts, excludes, tone, style, start, modules]
      properties:
        title: {type: string, minLength: 3}
        background_id: {type: string, minLength: 3}
        source_game: {type: string}          # the game, book or show this is set in, or "" for an original world
        world: {type: string, minLength: 20}
        era: {type: string, minLength: 2}
        starting_region: {type: string, minLength: 2}
        mode: {type: string, enum: [canon, historical, original, alternate]}
        canon_scope: {type: string}
        allowed_deviations: {type: string, minLength: 10}
        anchors:
          type: object
          required: [peoples_or_species, powers_or_supernatural_rules, technology, institutions, economics_or_trade, law_and_social_structure, creatures_or_threats]
          properties:
            peoples_or_species: {type: array, items: {type: string}, minItems: 1}
            powers_or_supernatural_rules: {type: array, items: {type: string}, minItems: 1}
            technology: {type: array, items: {type: string}, minItems: 1}
            institutions: {type: array, items: {type: string}, minItems: 1}
            religions_or_beliefs: {type: array, items: {type: string}}
            economics_or_trade: {type: array, items: {type: string}, minItems: 1}
            law_and_social_structure: {type: array, items: {type: string}, minItems: 1}
            creatures_or_threats: {type: array, items: {type: string}, minItems: 1}
        norms:
          type: object
          required: [law_and_outlaws, morale]
          properties:
            law_and_outlaws: {type: array, items: {type: string}, minItems: 1}
            morale:
              type: array
              minItems: 1
              items: {type: object, required: [kind, breaks], properties: {kind: {type: string}, breaks: {type: string}}}
        mp_powers:
          type: object
          required: [draws_mp, recovery, notes]
          properties:
            draws_mp: {type: array, items: {type: string}}
            recovery: {type: string, enum: [fast, slow, rest_only]}
            notes: {type: string}
        depicts: {type: array, items: {type: string}, minItems: 1}
        excludes: {type: array, items: {type: string}}
        tone: {type: string, minLength: 3}
        style: {type: string, minLength: 3}
        start:
          type: object
          required: [date, clock, daypart, season, weather]
          properties:
            date: {type: string}             # YYYY-MM-DD
            clock: {type: string}            # HH:MM
            daypart: {type: string}
            season: {type: string}
            weather: {type: string}
        modules:
          type: object
          required: [numeric_level_xp, equipment_power_tiers, bounded_scenario_endings, flexible_item_entitlement]
          properties:
            numeric_level_xp: &module {type: object, required: ["on", why], properties: {"on": {type: boolean}, why: {type: string, minLength: 5}}}
            equipment_power_tiers: *module
            bounded_scenario_endings: *module
            flexible_item_entitlement: *module

  - id: economy
    rules: [23_gen_economy]
    input: [premise]
    max_tokens: 2500
    output:
      type: object
      required: [currency, groups]
      properties:
        currency: {type: string, minLength: 2}
        groups:
          type: array
          minItems: 3
          items:
            type: object
            required: [group, items]
            properties:
              group: {type: string, enum: [work_rates, living, gear, services, specialist]}
              items:
                type: array
                minItems: 2
                items: {type: object, required: [item, price], properties: {item: {type: string}, price: {type: string}}}

  - id: player
    rules: [24_gen_player]
    input: [premise, economy]
    max_tokens: 3500
    output:
      type: object
      required: [name, age, origin, history, appearance, archetype, job, belongs, gender, character, status, starting_activity, skills, traits, established, limitations, level, hp, equipment, money, item_points, item_points_basis, knowledge, source_abilities]
      properties:
        name: {type: string, minLength: 3}
        age: {type: integer, minimum: 1}
        origin: {type: string}
        history: {type: array, items: {type: string}, minItems: 1}
        appearance: {type: string}
        archetype: {type: string}
        job: {type: string}
        belongs: {type: array, items: {type: string}}
        gender: {type: string, minLength: 3}
        character: {type: string, minLength: 10}
        status: {type: string}
        starting_activity: {type: string, minLength: 10}
        skills:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, class, tier, class_source, abilities]
            properties:
              id: {type: string}
              class: {type: string, enum: [NORMAL, ELITE, LEGENDARY]}
              tier: {type: string, enum: [T1, T2, T3, T4]}
              class_source: {type: string}
              abilities: {type: array, items: {type: string}}
        traits: {type: array, items: {type: string}}
        established: {type: array, items: {type: string}}
        limitations: {type: array, items: {type: string}}
        level: {type: integer, minimum: 1, maximum: 20}
        hp: {type: integer, minimum: 1}
        mp: {type: integer, minimum: 0}
        equipment:
          type: array
          items:
            type: object
            required: [item_id, name, type, capability_domain, condition, price_ref]
            properties:
              item_id: {type: string}
              name: {type: string}
              type: {type: string}
              capability_domain: {type: string}
              condition: {type: string, enum: [serviceable, worn, damaged, critical]}
              tier: {type: string, enum: [T1, T2, T3, T4]}
              special_properties: {type: array, items: {type: string}}
              abilities: {type: array, items: {type: string}}
              price_ref: {type: string}     # the item's name in the price list, or "personal" for what has no price
        money: {type: number, minimum: 0}
        item_points: {type: integer, minimum: 0}
        item_points_basis: {type: string}
        knowledge: {type: array, items: {type: object, required: [key, fact], properties: {key: {type: string}, fact: {type: string}}}}
        source_abilities:         # canon only: what the protagonist can really do when the story begins, in the source's own words
          type: array
          items: {type: object, required: [ability, skill], properties: {ability: {type: string}, skill: {type: string}}}

  - id: places
    rules: [25_gen_places]
    input: [premise, player]
    max_tokens: 2000
    output:
      type: object
      required: [start_location, locations]
      properties:
        start_location: {type: string}
        locations:
          type: array
          minItems: 3
          maxItems: 10
          items:
            type: object
            required: [id, name, surface, band_min, band_max, band_basis]
            properties:
              id: {type: string}
              name: {type: string}
              surface: {type: string}
              feature: {type: string}
              band_min: {type: integer, minimum: 1, maximum: 20}
              band_max: {type: integer, minimum: 1, maximum: 20}
              band_basis: {type: string}

  - id: cast
    rules: [26_gen_cast]
    input: [premise, player, places]
    max_tokens: 4000
    output:
      type: object
      required: [npcs, factions]
      properties:
        npcs:
          type: array
          minItems: 3
          items:
            type: object
            required: [id, name, gender, job, belongs, character, status, position, plan, due, wants, fears, values, tie, attitude]
            properties:
              id: {type: string}
              name: {type: string, minLength: 3}
              gender: {type: string, minLength: 3}
              job: {type: string}
              belongs: {type: array, items: {type: string}}
              character: {type: string, minLength: 10}
              status: {type: string}
              position: {type: string}
              plan: {type: string, minLength: 5}
              due: {type: string, minLength: 5}      # "YYYY-MM-DD HH:MM what happens" or "when <condition>"
              wants: {type: array, items: {type: string}}
              fears: {type: array, items: {type: string}}
              values: {type: array, items: {type: string}}
              tie: {type: string}
              attitude: {type: string}
              level: {type: integer, minimum: 1, maximum: 30}
              knows: {type: array, items: {type: object, required: [key, fact], properties: {key: {type: string}, fact: {type: string}}}}
        factions:
          type: array
          items:
            type: object
            required: [id, name, role, wants, fears]
            properties:
              id: {type: string}
              name: {type: string}
              role: {type: string}
              wants: {type: array, items: {type: string}}
              fears: {type: array, items: {type: string}}

  - id: story
    rules: [27_gen_story]
    input: [premise, player, places, cast]
    max_tokens: 3500
    output:
      type: object
      required: [quests, pressures, hidden, rights, endings]
      properties:
        quests:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, role, type, objective, status, participants]
            properties:
              id: {type: string}
              role: {type: string, enum: [MAIN, SIDE]}
              type: {type: string, enum: [SHORT, LONG, CHAIN]}
              objective: {type: string, minLength: 10}
              status: {type: string, enum: [available, active]}
              participants: {type: array, items: {type: string}}
        pressures:
          type: array
          items:
            type: object
            required: [id, name, origin, actors, trajectory, clock_name, segments, pace, first_check, on_fill]
            properties:
              id: {type: string}
              name: {type: string}
              origin: {type: string}
              actors: {type: array, items: {type: string}}
              trajectory: {type: string}
              clock_name: {type: string}
              segments: {type: integer, minimum: 2, maximum: 12}
              pace: {type: string}                # "every <interval> while <condition>"
              first_check: {type: string}         # "YYYY-MM-DD HH:MM"
              on_fill: {type: string}
        hidden:
          type: array
          items:
            type: object
            required: [id, cause, evidence, routes]
            properties:
              id: {type: string}
              cause: {type: string}
              prior_events: {type: array, items: {type: string}}
              evidence: {type: array, items: {type: string}}
              routes: {type: array, items: {type: string}, minItems: 2}
        rights:
          type: array
          items: {type: object, required: [id, type, parties, status], properties: {id: {type: string}, type: {type: string}, parties: {type: array, items: {type: string}}, status: {type: string}}}
        endings:
          type: object
          required: [core, hidden]
          properties:
            core: {type: array, items: {type: string}}
            hidden: {type: array, items: {type: string}}
